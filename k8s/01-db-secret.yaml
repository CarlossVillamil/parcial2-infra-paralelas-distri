# Credenciales de PostgreSQL. stringData se codifica en base64 al aplicarse.
# Nota: base64 NO es cifrado; en un entorno real se usaria un gestor de secretos
# (AWS Secrets Manager, Sealed Secrets, etc.) y este archivo no iria al repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: parcial2-app
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
