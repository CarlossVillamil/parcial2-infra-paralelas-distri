# Deployment de la API REST: 2 replicas, conexion a la BD por DNS interno,
# credenciales desde el Secret db-credentials y probes de salud.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcial2-api
  namespace: parcial2-app
  labels:
    app: parcial2-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parcial2-api
  template:
    metadata:
      labels:
        app: parcial2-api
    spec:
      containers:
        - name: api
          image: parcial2-api:1.0
          # La imagen se construye dentro de Minikube (minikube image build): no se descarga.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres-service.parcial2-app.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: parcialdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          # Readiness: solo recibe trafico si puede hablar con la BD.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: solo verifica que el proceso responda (no consulta la BD).
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
